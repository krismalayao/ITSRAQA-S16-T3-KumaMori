<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kumamori Login</title>
  
  <!-- Google Fonts: Fredoka -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-stripe-light: #fce8eb;
      --bg-stripe-dark: #fcdde3;
      --card-bg: #f9e2e6;
      --card-border: #c48b78;
      --text-brown: #5c3214;
      --input-border: #d4a390;
      --input-bg: #ffffff;
      --button-bg: #5c3214;
      --button-hover: #45240c;
      --error-red: #d9534f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Fredoka', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: repeating-linear-gradient(
        90deg,
        var(--bg-stripe-light),
        var(--bg-stripe-light) 65px,
        var(--bg-stripe-dark) 65px,
        var(--bg-stripe-dark) 130px
      );
    }

    .login-card {
      background-color: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 35px;
      width: 100%;
      max-width: 780px;
      padding: 40px 50px;
      display: flex;
      gap: 40px;
      align-items: center;
      box-shadow: 0 10px 25px rgba(92, 50, 20, 0.08);
    }

    .card-left {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .logo-img {
      max-width: 220px;
      height: auto;
      object-fit: contain;
      margin-bottom: 20px;
    }

    .register-text {
      font-size: 0.9rem;
      color: var(--text-brown);
      margin-top: 10px;
    }

    .register-text a {
      color: var(--text-brown);
      font-weight: 700;
      text-decoration: underline;
      cursor: pointer;
    }

    .card-right {
      flex: 1.2;
      display: flex;
      flex-direction: column;
    }

    .card-title {
      font-size: 2rem;
      color: var(--text-brown);
      font-weight: 700;
      margin-bottom: 25px;
      text-align: center;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 12px;
    }

    .form-group label {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-brown);
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 10px 18px;
      border-radius: 25px;
      border: 1.5px solid var(--input-border);
      background-color: var(--input-bg);
      font-size: 0.85rem;
      outline: none;
      color: var(--text-brown);
      transition: border-color 0.2s;
    }

    .form-group input::placeholder {
      color: #cca496;
      font-size: 0.8rem;
    }

    .form-group input:focus {
      border-color: var(--text-brown);
    }

    .password-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .password-wrapper input {
      padding-right: 45px;
    }

    .toggle-password {
      position: absolute;
      right: 15px;
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--input-border);
      transition: color 0.2s;
    }

    .toggle-password:hover {
      color: var(--text-brown);
    }

    .toggle-password svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .forgot-pass {
      display: block;
      margin-left: auto;
      width: fit-content;
      margin-top: 6px;
      margin-bottom: 20px;
      font-size: 0.8rem;
      color: var(--text-brown);
      text-decoration: none;
      opacity: 0.9;
    }

    .forgot-pass:hover {
      text-decoration: underline;
    }

    .submit-btn {
      background-color: var(--button-bg);
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 25px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      width: 100%;
    }

    .submit-btn:hover {
      background-color: var(--button-hover);
    }

    .submit-btn:active {
      transform: scale(0.99);
    }

    /* -------------------------------------------------------------------------- */
    /* Red Toast Notification (Bottom Left)                                       */
    /* -------------------------------------------------------------------------- */
    .toast-notification {
      position: fixed;
      bottom: 25px;
      left: 25px;
      background-color: var(--error-red);
      color: #ffffff;
      padding: 14px 22px;
      border-radius: 18px;
      font-size: 0.9rem;
      font-weight: 600;
      box-shadow: 0 8px 20px rgba(217, 83, 79, 0.3);
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.3s ease, transform 0.3s ease;
      pointer-events: none;
      z-index: 1000;
    }

    .toast-notification.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 650px) {
      .login-card {
        flex-direction: column;
        padding: 30px 20px;
        margin: 20px;
      }

      .toast-notification {
        left: 50%;
        transform: translate(-50%, 20px);
        width: 90%;
        justify-content: center;
      }

      .toast-notification.show {
        transform: translate(-50%, 0);
      }
    }
  </style>
</head>
<body>

  <main class="login-card">
    <section class="card-left">
      <img src="your-logo-image.png" alt="Kumamori Logo" class="logo-img">
      <p class="register-text">
        New to Kumamori? <a href="registerPage.html" id="register-link">Register Now</a>
      </p>
    </section>

    <section class="card-right">
      <h1 class="card-title">Welcome Back!</h1>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Type your email address" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-wrapper">
            <input type="password" id="password" placeholder="Type your password" required>
            <button type="button" id="toggle-password" class="toggle-password" aria-label="Toggle password visibility">
              <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
              </svg>
            </button>
          </div>
        </div>

        <a href="#" class="forgot-pass" id="forgot-password">Forgot password?</a>
        <button type="submit" class="submit-btn">Log In</button>
      </form>
    </section>
  </main>

  <!-- Red Toast Notification Container -->
  <div id="toast" class="toast-notification">
    <span id="toast-message">Incorrect email or password. Please try again.</span>
  </div>

  <script>
    // -------------------------------------------------------------------------
    // EMBEDDED JSON USER DATABASE
    // -------------------------------------------------------------------------
    const usersJSON = `[
      {
        "id": 1,
        "name": "Kumamori Admin",
        "email": "admin@kumamori.com",
        "password": "password123"
      },
      {
        "id": 2,
        "name": "Jane Doe",
        "email": "jane@example.com",
        "password": "secretpassword"
      }
    ]`;

    // Parse the JSON string into a usable JavaScript Array
    const usersDatabase = JSON.parse(usersJSON);

    document.addEventListener('DOMContentLoaded', () => {
      const loginForm = document.getElementById('login-form');
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const togglePasswordBtn = document.getElementById('toggle-password');
      const eyeIcon = document.getElementById('eye-icon');
      const toast = document.getElementById('toast');

      const eyeOpenPath = `M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z`;
      const eyeClosedPath = `M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.44-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.17c0-1.66-1.34-3-3-3l-.17.02z`;

      let toastTimeout;

      function showErrorToast() {
        // Clear active timeout if user clicks submit multiple times quickly
        clearTimeout(toastTimeout);
        
        toast.classList.add('show');

        // Automatically hide the toast after 3 seconds
        toastTimeout = setTimeout(() => {
          toast.classList.remove('show');
        }, 3000);
      }

      togglePasswordBtn.addEventListener('click', () => {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        if (isPassword) {
          passwordInput.setAttribute('type', 'text');
          eyeIcon.querySelector('path').setAttribute('d', eyeClosedPath);
        } else {
          passwordInput.setAttribute('type', 'password');
          eyeIcon.querySelector('path').setAttribute('d', eyeOpenPath);
        }
      });

      // Login handler checking inputs against usersDatabase
      loginForm.addEventListener('submit', (e) => {
        e.preventDefault();

        const enteredEmail = emailInput.value.trim().toLowerCase();
        const enteredPassword = passwordInput.value;

        // Search in JSON array
        const userFound = usersDatabase.find(
          user => user.email.toLowerCase() === enteredEmail && user.password === enteredPassword
        );

        if (userFound) {
          // Success: Immediately redirect to Customer Dashboard
          window.location.href = 'customerDashboard.html';
        } else {
          // Failure: Trigger the red bottom-left toast notification
          showErrorToast();
        }
      });
    });
  </script>

</body>
</html>
