<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="48x48" href="../images/kumamoriFavicon.png">
  <title>KumaMori - Login Page</title>
  
  <!-- Google Fonts: Fredoka -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-stripe-light: #fce8eb;
      --bg-stripe-dark: #fcdde3;
      --card-bg: #f9e2e6;
      --card-border: #c48b78;
      --text-brown: #5c3214;
      --input-border: #d4a390;
      --input-bg: #ffffff;
      --button-bg: #5c3214;
      --button-hover: #45240c;
      --error-red: #d9534f;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Fredoka', sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: repeating-linear-gradient(
        90deg,
        var(--bg-stripe-light),
        var(--bg-stripe-light) 65px,
        var(--bg-stripe-dark) 65px,
        var(--bg-stripe-dark) 130px
      );
    }

    .login-card {
      background-color: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 35px;
      width: 100%;
      max-width: 780px;
      padding: 40px 50px;
      display: flex;
      gap: 40px;
      align-items: center;
      box-shadow: 0 10px 25px rgba(92, 50, 20, 0.08);
    }

    .card-left {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .logo-img {
      max-width: 220px;
      height: auto;
      object-fit: contain;
      margin-bottom: 20px;
    }

    .register-text {
      font-size: 0.9rem;
      color: var(--text-brown);
      margin-top: 10px;
    }

    .register-text a {
      color: var(--text-brown);
      font-weight: 700;
      text-decoration: underline;
      cursor: pointer;
    }

    .register-mobile {
      display: none;
    }

    .card-right {
      flex: 1.2;
      display: flex;
      flex-direction: column;
    }

    .card-title {
      font-size: 2rem;
      color: var(--text-brown);
      font-weight: 700;
      margin-bottom: 25px;
      text-align: center;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 12px;
    }

    .form-group label {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-brown);
      margin-bottom: 6px;
    }

    .form-group input {
      width: 100%;
      padding: 10px 18px;
      border-radius: 25px;
      border: 1.5px solid var(--input-border);
      background-color: var(--input-bg);
      font-size: 0.85rem;
      outline: none;
      color: var(--text-brown);
      transition: border-color 0.2s;
    }

    .form-group input::placeholder {
      color: #cca496;
      font-size: 0.8rem;
    }

    .form-group input:focus {
      border-color: var(--text-brown);
    }

    .password-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .password-wrapper input {
      padding-right: 45px;
    }

    .toggle-password {
      position: absolute;
      right: 15px;
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--input-border);
      transition: color 0.2s;
    }

    .toggle-password:hover {
      color: var(--text-brown);
    }

    .toggle-password svg {
      width: 20px;
      height: 20px;
      fill: currentColor;
    }

    .forgot-pass {
      display: block;
      margin-left: auto;
      width: fit-content;
      margin-top: 6px;
      margin-bottom: 20px;
      font-size: 0.8rem;
      color: var(--text-brown);
      text-decoration: none;
      opacity: 0.9;
      cursor: pointer;
    }

    .forgot-pass:hover {
      text-decoration: underline;
    }

    .submit-btn {
      background-color: var(--button-bg);
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 25px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      width: 100%;
    }

    .submit-btn:hover {
      background-color: var(--button-hover);
    }

    .submit-btn:active {
      transform: scale(0.99);
    }

    /* --- MODAL STYLES --- */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(92, 50, 20, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 2000;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background-color: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 30px;
      width: 90%;
      max-width: 440px;
      padding: 30px 35px;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
      position: relative;
      transform: translateY(-20px);
      transition: transform 0.3s ease;
      text-align: center;
    }

    .modal-overlay.active .modal-card {
      transform: translateY(0);
    }

    .close-modal-btn {
      position: absolute;
      top: 18px;
      right: 20px;
      background: none;
      border: none;
      font-size: 1.5rem;
      color: var(--text-brown);
      cursor: pointer;
      font-weight: 700;
      line-height: 1;
    }

    .modal-title {
      font-size: 1.5rem;
      color: var(--text-brown);
      font-weight: 700;
      margin-bottom: 6px;
    }

    .modal-subtitle {
      font-size: 0.8rem;
      color: var(--text-brown);
      opacity: 0.8;
      margin-bottom: 15px;
    }

    .demo-badge {
      background-color: #fff3cd;
      border: 1px solid #ffeeba;
      color: #856404;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-bottom: 15px;
    }

    .modal-step { display: none; }
    .modal-step.active { display: block; }

    .otp-input {
      letter-spacing: 6px;
      font-size: 1.1rem !important;
      text-align: center;
    }

    .modal-error {
      color: var(--error-red);
      font-size: 0.75rem;
      font-weight: 600;
      margin-top: 4px;
      text-align: left;
      display: block;
    }

    .toast-notification {
      position: fixed;
      bottom: 25px;
      left: 25px;
      background-color: var(--error-red);
      color: #ffffff;
      padding: 14px 22px;
      border-radius: 18px;
      font-size: 0.9rem;
      font-weight: 600;
      box-shadow: 0 8px 20px rgba(217, 83, 79, 0.3);
      display: flex;
      align-items: center;
      gap: 10px;
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.3s ease, transform 0.3s ease;
      pointer-events: none;
      z-index: 1000;
    }

    .toast-notification.show {
      opacity: 1;
      transform: translateY(0);
    }

    @media (max-width: 650px) {
      .login-card {
        flex-direction: column;
        padding: 30px 20px;
        margin: 20px;
      }

      .card-left .register-text {
        display: none;
      }

      .register-mobile {
        display: block;
        text-align: center;
        margin-top: 20px;
      }

      .toast-notification {
        left: 50%;
        transform: translate(-50%, 20px);
        width: 90%;
        justify-content: center;
      }

      .toast-notification.show {
        transform: translate(-50%, 0);
      }
    }
  </style>
</head>
<body>

  <main class="login-card">
    <section class="card-left">
      <img src="../images/publicPages.png" alt="Kumamori Logo" class="logo-img">
      <p class="register-text">
        New to Kumamori? <a href="registerPage.html" id="register-link">Register Now</a>
      </p>
    </section>

    <section class="card-right">
      <h1 class="card-title">Welcome Back!</h1>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="Type your email address" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-wrapper">
            <input type="password" id="password" placeholder="Type your password" required>
            <button type="button" id="toggle-password" class="toggle-password" aria-label="Toggle password visibility">
              <svg id="eye-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
              </svg>
            </button>
          </div>
        </div>

        <a class="forgot-pass" id="forgot-password">Forgot password?</a>
        <button type="submit" class="submit-btn">Log In</button>
      </form>

      <div class="register-text register-mobile">
        New to Kumamori? <a href="registerPage.html">Register Now</a>
      </div>
    </section>
  </main>

  <!-- FORGOT PASSWORD MODAL -->
  <div id="forgot-modal" class="modal-overlay">
    <div class="modal-card">
      <button type="button" class="close-modal-btn" id="close-modal">&times;</button>
      
      <h2 class="modal-title">Reset Password</h2>
      <p class="modal-subtitle">Follow the steps to recover your account.</p>

      <div class="demo-badge">
        ⚠️ <strong>Prototype Mode:</strong> Testing OTP is <code>000000</code>.
      </div>

      <!-- STEP 1: Email Request -->
      <form id="modal-step1" class="modal-step active">
        <div class="form-group">
          <label for="modal-email">Email Address</label>
          <input type="email" id="modal-email" placeholder="Enter your registered email" required>
          <span id="modal-email-error" class="modal-error"></span>
        </div>
        <button type="submit" class="submit-btn">Send OTP Code</button>
      </form>

      <!-- STEP 2: Verify OTP -->
      <form id="modal-step2" class="modal-step">
        <div class="form-group">
          <label for="modal-otp">Enter 6-Digit OTP</label>
          <input type="text" id="modal-otp" class="otp-input" maxlength="6" placeholder="000000" required>
          <span id="modal-otp-error" class="modal-error"></span>
        </div>
        <button type="submit" class="submit-btn">Verify OTP</button>
      </form>

      <!-- STEP 3: Change Password -->
      <form id="modal-step3" class="modal-step">
        <div class="form-group">
          <label for="modal-new-pass">New Password</label>
          <div class="password-wrapper">
            <input type="password" id="modal-new-pass" placeholder="Enter new password" required>
            <button type="button" class="toggle-password modal-toggle" data-target="modal-new-pass">
              <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
            </button>
          </div>
        </div>
        <div class="form-group">
          <label for="modal-confirm-pass">Confirm New Password</label>
          <div class="password-wrapper">
            <input type="password" id="modal-confirm-pass" placeholder="Re-type new password" required>
            <button type="button" class="toggle-password modal-toggle" data-target="modal-confirm-pass">
              <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
            </button>
          </div>
          <span id="modal-pass-error" class="modal-error"></span>
        </div>
        <button type="submit" class="submit-btn">Update Password</button>
      </form>
    </div>
  </div>

  <div id="toast" class="toast-notification">
    <span id="toast-message">Incorrect email or password. Please try again.</span>
  </div>

  <script src="../auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const loginForm = document.getElementById('login-form');
      const emailInput = document.getElementById('email');
      const passwordInput = document.getElementById('password');
      const togglePasswordBtn = document.getElementById('toggle-password');
      const eyeIcon = document.getElementById('eye-icon');
      const toast = document.getElementById('toast');

      const eyeOpenPath = `M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z`;
      const eyeClosedPath = `M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.44-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.17c0-1.66-1.34-3-3-3l-.17.02z`;

      let toastTimeout;

      function showToast(message, type = 'error') {
        const toastMessage = document.getElementById('toast-message');
        toastMessage.textContent = message;
        clearTimeout(toastTimeout);
        if (type === 'success') {
          toast.style.backgroundColor = '#4CAF50';
          toast.style.boxShadow = '0 8px 20px rgba(76,175,80,.35)';
        } else {
          toast.style.backgroundColor = '#d9534f';
          toast.style.boxShadow = '0 8px 20px rgba(217,83,79,.35)';
        }
        toast.classList.add('show');
        toastTimeout = setTimeout(() => {
          toast.classList.remove('show');
        }, 3000);
      }

      togglePasswordBtn.addEventListener('click', () => {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        if (isPassword) {
          passwordInput.setAttribute('type', 'text');
          eyeIcon.querySelector('path').setAttribute('d', eyeClosedPath);
        } else {
          passwordInput.setAttribute('type', 'password');
          eyeIcon.querySelector('path').setAttribute('d', eyeOpenPath);
        }
      });

      loginForm.addEventListener('submit', (e) => {
        e.preventDefault();

        const enteredEmail = emailInput.value.trim().toLowerCase();
        const enteredPassword = passwordInput.value;

        const usersDatabase = getUsers();
        const userFound = usersDatabase.find(
          user => user.email.toLowerCase() === enteredEmail && user.password === enteredPassword
        );

        if (userFound) {
          setCurrentUser(userFound);

          if (userFound.role === 'admin') {
            window.location.href = '../adminSide/adminDashboard.html';
          } else {
            window.location.href = '../customerSide/userLandingPage.html';
          }
        } else {
          showToast('Incorrect email or password.');
        }
      });

      // --- MODAL & FORGOT PASSWORD LOGIC ---
      const forgotBtn = document.getElementById('forgot-password');
      const forgotModal = document.getElementById('forgot-modal');
      const closeModalBtn = document.getElementById('close-modal');

      const modalStep1 = document.getElementById('modal-step1');
      const modalStep2 = document.getElementById('modal-step2');
      const modalStep3 = document.getElementById('modal-step3');

      const MOCK_OTP = "000000";
      let resetTargetEmail = "";

      function resetModalState() {
        modalStep1.reset();
        modalStep2.reset();
        modalStep3.reset();
        document.getElementById('modal-email-error').textContent = '';
        document.getElementById('modal-otp-error').textContent = '';
        document.getElementById('modal-pass-error').textContent = '';

        modalStep1.classList.add('active');
        modalStep2.classList.remove('active');
        modalStep3.classList.remove('active');
      }

      // Open Modal
      forgotBtn.addEventListener('click', () => {
        resetModalState();
        if (emailInput.value.trim()) {
          document.getElementById('modal-email').value = emailInput.value.trim();
        }
        forgotModal.classList.add('active');
      });

      // Close Modal
      closeModalBtn.addEventListener('click', () => {
        forgotModal.classList.remove('active');
      });

      // Close when clicking overlay backdrop
      forgotModal.addEventListener('click', (e) => {
        if (e.target === forgotModal) {
          forgotModal.classList.remove('active');
        }
      });

      // --- Bind Modal Password Toggles Immediately ---
      document.querySelectorAll('.modal-toggle').forEach(button => {
        button.addEventListener('click', () => {
          const input = document.getElementById(button.dataset.target);
          const icon = button.querySelector('path');
          const isPassword = input.getAttribute('type') === 'password';
          
          if (isPassword) {
            input.setAttribute('type', 'text');
            icon.setAttribute('d', eyeClosedPath);
          } else {
            input.setAttribute('type', 'password');
            icon.setAttribute('d', eyeOpenPath);
          }
        });
      });

      // --- STEP 1: Verify Email Exists ---
      modalStep1.addEventListener('submit', (e) => {
        e.preventDefault();
        const enteredEmail = document.getElementById('modal-email').value.trim();
        const users = getUsers();
        const userExists = users.some(u => u.email.toLowerCase() === enteredEmail.toLowerCase());

        if (!userExists) {
          document.getElementById('modal-email-error').textContent = '✕ Email address not found.';
          return;
        }

        resetTargetEmail = enteredEmail;
        document.getElementById('modal-email-error').textContent = '';

        modalStep1.classList.remove('active');
        modalStep2.classList.add('active');
      });

      // --- STEP 2: Verify Static OTP ---
      modalStep2.addEventListener('submit', (e) => {
        e.preventDefault();
        const enteredOtp = document.getElementById('modal-otp').value.trim();

        if (enteredOtp !== MOCK_OTP) {
          document.getElementById('modal-otp-error').textContent = '✕ Invalid OTP. Enter 000000.';
          return;
        }

        document.getElementById('modal-otp-error').textContent = '';

        modalStep2.classList.remove('active');
        modalStep3.classList.add('active');
      });

      // --- STEP 3: Reset Password ---
      modalStep3.addEventListener('submit', (e) => {
        e.preventDefault();
        const newPassword = document.getElementById('modal-new-pass').value;
        const confirmPassword = document.getElementById('modal-confirm-pass').value;

        if (newPassword !== confirmPassword) {
          document.getElementById('modal-pass-error').textContent = '✕ Passwords do not match.';
          return;
        }

        const success = resetUserPassword(resetTargetEmail, newPassword);

        if (success) {
          showToast('Password changed successfully! You may now log in.', 'success');
          forgotModal.classList.remove('active');
          emailInput.value = resetTargetEmail;
          passwordInput.value = newPassword;
        } else {
          document.getElementById('modal-pass-error').textContent = '✕ Failed to reset password.';
        }
      });
    });
  </script>
</body>
</html>
