<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>KumaMori - Cart</title>
<link rel="icon" type="image/png" sizes="48x48" href="../images/kumamoriFavicon.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
:root{
    --card-bg:#f9e2e6;
    --card-border:#c48b78;
    --text-brown:#5c3214;
    --text-brown-light:#7a5335;
    --button-bg:#5c3214;
    --button-hover:#45240c;
    --accent:#C69866;
    --danger:#e8607a;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Fredoka',sans-serif;}
html{overflow-y:scroll;}
html, body{height:100%;}
body{
    background:#fff;
    color:var(--text-brown);
    display:flex;
    flex-direction:column;
    min-height:100vh;
}

.page-wrap{max-width:900px;margin:0 auto;padding:60px 40px 90px;flex:1;width:100%;}
.page-title{font-size:2.6rem;font-weight:700;text-align:center;margin-bottom:20px;}
.title-divider{width:100%;height:2px;background:var(--text-brown);opacity:.4;margin-bottom:40px;}

.btn-brown{
    background:var(--button-bg);color:#fff;border:none;
    padding:14px 32px;border-radius:25px;font-weight:600;
    cursor:pointer;text-decoration:none;display:inline-block;
    transition:background-color .2s, transform .15s, box-shadow .2s;
    box-shadow:0 6px 15px rgba(92,50,20,0.25);
}
.btn-brown:hover{background:var(--button-hover);transform:translateY(-2px);box-shadow:0 10px 20px rgba(92,50,20,0.3);}
.btn-brown:active{transform:translateY(0);}

.cart-empty{
    background:#fff;
    border:2px dashed var(--card-border);
    border-radius:24px;
    padding:60px 30px;
    text-align:center;
    box-shadow:0 12px 30px rgba(92,50,20,0.08);
}
.cart-empty i{
    font-size:2.6rem;
    color:var(--button-bg);
    margin-bottom:16px;
    display:inline-block;
}
.cart-empty p{font-weight:600;color:var(--text-brown-light);margin-bottom:20px;}

.cart-item{
    background:#fff;
    border-radius:20px;
    box-shadow:0 10px 24px rgba(92,50,20,0.08);
    padding:22px 30px;
    margin-bottom:20px;
    transition:transform .2s, box-shadow .2s;
}
.cart-item:hover{transform:translateY(-3px);box-shadow:0 14px 28px rgba(92,50,20,0.12);}
.cart-item h3{font-size:1.1rem;font-weight:700;margin-bottom:14px;}
.cart-item-divider{height:1px;background:#eee0d8;margin-bottom:16px;}

.cart-item-row{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;}
.cart-item-left{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}

.qty-control{
    display:flex;align-items:center;gap:0;
    border:1px solid var(--button-bg);
    border-radius:14px;
    overflow:hidden;
}
.qty-control button{
    background:#fff;border:none;
    padding:10px 14px;
    color:var(--text-brown);
    font-weight:700;
    font-size:1rem;
    cursor:pointer;
}
.qty-control input{
    width:40px;
    text-align:center;
    border:none;
    border-left:1px solid var(--button-bg);
    border-right:1px solid var(--button-bg);
    padding:10px 0;
    font-weight:600;
    font-family:'Fredoka',sans-serif;
    color:var(--text-brown);
}
.qty-control input:focus{outline:none;}

.edit-btn{
    background:#fff;
    border:1.5px solid var(--button-bg);
    color:var(--text-brown);
    padding:10px 20px;
    border-radius:16px;
    font-weight:600;
    font-size:.9rem;
    cursor:pointer;
    transition:background .2s, color .2s;
}
.edit-btn:hover{background:var(--button-bg);color:#fff;}

.cart-item-price{font-weight:700;color:var(--accent);font-size:1.05rem;}

.cart-summary{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--card-bg);
    border-radius:20px;
    padding:22px 30px;
    margin-top:10px;
    box-shadow:0 10px 24px rgba(92,50,20,0.08);
}
.cart-summary .total-label{font-weight:600;color:var(--text-brown-light);font-size:.9rem;}
.cart-summary .total-amount{font-size:1.5rem;font-weight:700;}
.checkout-btn{
    background:var(--button-bg);color:#fff;border:none;
    padding:14px 36px;border-radius:22px;
    font-weight:700;font-size:1rem;cursor:pointer;
    box-shadow:0 6px 14px rgba(92,50,20,0.2);
    transition:background-color .2s, transform .15s;
    text-decoration:none;
    display:inline-block;
}
.checkout-btn:hover{background:var(--button-hover);transform:translateY(-2px);}

@media (max-width:600px){
    .cart-summary{flex-direction:column;gap:16px;align-items:stretch;text-align:center;}
}
</style>
</head>
<body>

<script>window.CURRENT_PAGE = 'cart';</script>
<script src="navigationBar.js"></script>

<div class="page-wrap">

    <h1 class="page-title">Your Cart</h1>
    <div class="title-divider"></div>

    <div id="cart-empty-state" class="cart-empty" style="display:none;">
        <i class="fa-solid fa-bag-shopping"></i>
        <p>No items in your cart.</p>
        <a href="productsPage.html" class="btn-brown">Browse the Collection</a>
    </div>

    <div id="cart-items"></div>

    <div class="cart-summary" id="cart-summary" style="display:none;">
        <div>
            <div class="total-label">TOTAL</div>
            <div class="total-amount" id="cart-total">₱0.00</div>
        </div>
        <a href="paymentPlanPage.html" class="checkout-btn">Checkout</a>
    </div>

</div>

<script src="footer.js"></script>

<script>
function getActiveUserKey() {
    const session = JSON.parse(localStorage.getItem('km_session') || '{}');
    return session.username || sessionStorage.getItem('activeUser') || 'guest';
}

function fetchCart() {
    if (typeof getUserCart === 'function') {
        const userCart = getUserCart();
        if (userCart && Array.isArray(userCart)) return userCart;
    }
    const userKey = getActiveUserKey();
    const keyedCartRaw = localStorage.getItem('kumamori_cart_' + userKey);
    
    // Check user-specific key first, returning empty array if set to []
    if (keyedCartRaw !== null) {
        try {
            return JSON.parse(keyedCartRaw);
        } catch (e) {
            return [];
        }
    }

    // Fallback to plain key ONLY when user-specific key is completely uninitialized
    const fallbackRaw = localStorage.getItem('kumamori_cart') || sessionStorage.getItem('kumamori_cart');
    if (fallbackRaw) {
        try {
            return JSON.parse(fallbackRaw);
        } catch (e) {
            return [];
        }
    }
    return [];
}

function persistCart(cart) {
    if (typeof saveUserCart === 'function') {
        saveUserCart(cart);
    }
    const userKey = getActiveUserKey();
    const jsonStr = JSON.stringify(cart);
    localStorage.setItem('kumamori_cart_' + userKey, jsonStr);
    localStorage.setItem('kumamori_cart', jsonStr);
    sessionStorage.setItem('kumamori_cart', jsonStr);
}

document.addEventListener('DOMContentLoaded', () => {
    window.CURRENT_PAGE = 'cart';
    renderCart();
});

function renderCart() {
    const emptyState = document.getElementById('cart-empty-state');
    const itemsContainer = document.getElementById('cart-items');
    const summaryBar = document.getElementById('cart-summary');
    const totalEl = document.getElementById('cart-total');

    const cart = fetchCart();

    if (!cart || cart.length === 0) {
        emptyState.style.display = 'block';
        itemsContainer.innerHTML = '';
        summaryBar.style.display = 'none';
        return;
    }

    emptyState.style.display = 'none';
    summaryBar.style.display = 'flex';

    let total = 0;

    itemsContainer.innerHTML = cart.map((item, index) => {
        const qty = item.qty || item.quantity || 1;
        const price = parseFloat(item.price) || 0;
        const itemTotal = price * qty;
        total += itemTotal;

        let detailsList = [];

        if (Array.isArray(item.edits) && item.edits.length > 0) {
            detailsList = item.edits;
        } 
        else if (item.customizations || item.customData) {
            const data = item.customizations || item.customData;
            for (let key in data) {
                if (data[key] && typeof data[key] !== 'object') {
                    const label = key.charAt(0).toUpperCase() + key.slice(1);
                    detailsList.push(`${label}: ${data[key]}`);
                }
            }
        } 
        else {
            const keys = ['text', 'letter', 'charm', 'pendant', 'figurine', 'font', 'addon'];
            keys.forEach(k => {
                if (item[k]) detailsList.push(`${k.charAt(0).toUpperCase() + k.slice(1)}: ${item[k]}`);
            });
        }

        let customHTML = '';
        if (detailsList.length > 0) {
            customHTML = `<div style="font-size:0.9rem; color:var(--text-brown-light); margin-bottom:12px; line-height:1.4;">
                ${detailsList.join(' &bull; ')}
            </div>`;
        }

        return `
            <div class="cart-item">
                <h3>${item.name || 'Keychain'}</h3>
                ${customHTML}
                <div class="cart-item-divider"></div>
                <div class="cart-item-row">
                    <div class="cart-item-left">
                        <div class="qty-control">
                            <button onclick="changeQty(${index}, -1)">-</button>
                            <input type="text" value="${qty}" readonly>
                            <button onclick="changeQty(${index}, 1)">+</button>
                        </div>
                        <button class="edit-btn" onclick="removeItem(${index})"><i class="fa-solid fa-trash"></i> Remove</button>
                    </div>
                    <div class="cart-item-price">₱${itemTotal.toFixed(2)}</div>
                </div>
            </div>
        `;
    }).join('');

    totalEl.textContent = `₱${total.toFixed(2)}`;
}

function changeQty(index, delta) {
    const cart = fetchCart();
    if (!cart[index]) return;
    
    let qty = (cart[index].qty || cart[index].quantity || 1) + delta;
    if (qty <= 0) {
        cart.splice(index, 1);
    } else {
        cart[index].qty = qty;
        cart[index].quantity = qty;
    }
    persistCart(cart);
    renderCart();
}

function removeItem(index) {
    const cart = fetchCart();
    cart.splice(index, 1);
    persistCart(cart);
    renderCart();
}
</script>

</body>
</html>
