<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/png" sizes="48x48" href="../images/kumamoriFavicon.png">
<title>KumaMori - Products</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
:root{
    --text-brown:#5c3214;
    --text-brown-light:#7a5335;
    --card-img-bg:#fdf3dd;
    --button-bg:#5c3214;
    --button-hover:#45240c;
    --price:#C69866;
    --success-color:#2e7d32;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Fredoka',sans-serif;}
body{background:#fff;color:var(--text-brown);overflow-x:hidden;}

.page-wrap{max-width:1000px;margin:0 auto;padding:60px 40px 90px;}

.page-title{
    text-align:center;
    font-size:2.8rem;
    font-weight:700;
    margin-bottom:20px;
}
.title-divider{
    width:100%;
    height:2px;
    background:var(--text-brown);
    opacity:.4;
    margin-bottom:50px;
}

.product-card{
    position:relative;
    display:flex;
    align-items:center;
    gap:40px;
    background:#fff;
    border-radius:24px;
    box-shadow:0 12px 30px rgba(92,50,20,0.1);
    padding:28px 34px;
    margin-bottom:36px;
    transition:transform .25s, box-shadow .25s;
    overflow:hidden;
}
.product-card::before{
    content:'';
    position:absolute;
    left:0;top:0;bottom:0;
    width:5px;
    background:var(--price);
    opacity:0;
    transition:opacity .25s;
}
.product-card:hover{
    transform:translateY(-4px);
    box-shadow:0 18px 38px rgba(92,50,20,0.14);
}
.product-card:hover::before{opacity:1;}

.badge{
    position:absolute;
    top:18px;
    left:-38px;
    background:var(--button-bg);
    color:#fff;
    font-size:.72rem;
    font-weight:700;
    letter-spacing:.5px;
    text-transform:uppercase;
    padding:5px 40px;
    transform:rotate(-45deg);
    box-shadow:0 3px 8px rgba(0,0,0,0.2);
}

.product-img{
    flex-shrink:0;
    width:220px;
    height:200px;
    border-radius:18px;
    background:var(--card-img-bg);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}
.product-img img{
    max-width:85%;
    max-height:85%;
    object-fit:contain;
    transition:transform .35s ease;
}
.product-card:hover .product-img img{transform:scale(1.06) rotate(-2deg);}

.product-info{flex:1;width:100%;}
.product-top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:16px;
    padding-bottom:14px;
    border-bottom:2px solid #eee0d8;
    margin-bottom:14px;
}
.product-info h2{
    font-size:1.5rem;
    font-weight:700;
    line-height:1.25;
}
.product-price{
    flex-shrink:0;
    color:var(--price);
    font-weight:700;
    font-size:1.05rem;
    white-space:nowrap;
    padding-top:2px;
}
.product-info p{
    color:var(--text-brown-light);
    font-size:.92rem;
    line-height:1.55;
    margin-bottom:20px;
}

.btn-brown{
    background:var(--button-bg);
    color:#fff;
    border:none;
    padding:12px 28px;
    border-radius:22px;
    font-weight:600;
    font-size:.9rem;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:8px;
    transition:background-color .2s, transform .15s, box-shadow .2s;
    box-shadow:0 6px 14px rgba(92,50,20,0.18);
}
.btn-brown:hover{background:var(--button-hover);transform:translateY(-2px);box-shadow:0 10px 18px rgba(92,50,20,0.24);}
.btn-brown:active{transform:translateY(0);}

/* Toast Notification */
.toast-notification {
    position: fixed;
    bottom: 25px;
    left: 25px;
    background-color: var(--success-color);
    color: #ffffff;
    padding: 14px 22px;
    border-radius: 18px;
    font-size: 0.9rem;
    font-weight: 600;
    box-shadow: 0 8px 20px rgba(92, 50, 20, 0.2);
    display: flex;
    align-items: center;
    gap: 10px;
    opacity: 0;
    transform: translateY(20px);
    transition: opacity 0.3s ease, transform 0.3s ease;
    pointer-events: none;
    z-index: 1000;
}

.toast-notification.show {
    opacity: 1;
    transform: translateY(0);
}

/* Responsive Media Queries */
@media (max-width: 768px){
    .page-wrap {
        padding: 40px 20px 70px;
    }
    .page-title {
        font-size: 2.2rem;
    }
    .title-divider {
        margin-bottom: 35px;
    }
    .product-card {
        flex-direction: column;
        align-items: stretch;
        padding: 22px 20px;
        gap: 20px;
    }
    .product-img {
        width: 100%;
        height: 210px;
    }
    .product-top {
        flex-direction: column;
        gap: 8px;
        align-items: flex-start;
    }
    .product-price {
        padding-top: 0;
        font-size: 1.1rem;
    }
    .btn-brown {
        width: 100%;
        justify-content: center;
        padding: 14px 20px;
    }
    .toast-notification {
        left: 50%;
        transform: translate(-50%, 20px);
        width: 90%;
        justify-content: center;
    }
    .toast-notification.show {
        transform: translate(-50%, 0);
    }
}
</style>
</head>
<body>

<script>window.CURRENT_PAGE = 'product';</script>
<script src="navigationBar.js"></script>
<script src="../auth.js"></script>

<div class="page-wrap">

    <h1 class="page-title">Products</h1>
    <div class="title-divider"></div>

    <div id="productsContainer">
        <!-- Product cards are rendered here from the admin-managed product list (see script below) -->
    </div>

</div>

<!-- Toast Notification Container -->
<div id="toast" class="toast-notification">
    <i class="fa-solid fa-circle-check"></i>
    <span id="toast-message">Item added to your cart!</span>
</div>

<script src="footer.js"></script>

<script>
function getActiveUserKey() {
    const session = JSON.parse(sessionStorage.getItem('km_session') || '{}');
    return session.id || session.email || sessionStorage.getItem('activeUser') || 'guest';
}

function getCart(){
    if (typeof getUserCart === 'function') return getUserCart();
    const userKey = getActiveUserKey();
    return JSON.parse(localStorage.getItem('kumamori_cart_' + userKey) || '[]');
}

function saveCart(cart){
    if (typeof saveUserCart === 'function') {
        saveUserCart(cart);
    } else {
        const userKey = getActiveUserKey();
        localStorage.setItem('kumamori_cart_' + userKey, JSON.stringify(cart));
    }
}

let toastTimeout;
function showToast(message) {
    const toast = document.getElementById('toast');
    const toastMsg = document.getElementById('toast-message');
    if (toastMsg) toastMsg.textContent = message;
    clearTimeout(toastTimeout);
    toast.classList.add('show');
    toastTimeout = setTimeout(() => {
        toast.classList.remove('show');
    }, 3000);
}

function addToCart(product) {
    const cart = getCart();
    const existingIndex = cart.findIndex(item => item.id === product.id || item.name === product.name);
    
    if (existingIndex > -1) {
        const currentQty = cart[existingIndex].qty || cart[existingIndex].quantity || 1;
        cart[existingIndex].qty = currentQty + 1;
        cart[existingIndex].quantity = currentQty + 1;
    } else {
        cart.push({
            ...product,
            qty: product.qty || product.quantity || 1,
            quantity: product.qty || product.quantity || 1
        });
    }
    
    saveCart(cart);
    showToast(`${product.name} added to cart!`);
}

// Known product-name keywords map to existing product photos and
// customizePage.html types, so the original four products keep looking
// exactly the same. Anything the admin adds beyond those falls back to a
// generic icon placeholder and a name-based customize type.
function inferImage(name) {
    const n = name.toLowerCase();
    if (n.includes('bear')) return '../images/bear.png';
    if (n.includes('leather')) return '../images/leather.png';
    if (n.includes('bead')) return '../images/beaded.png';
    if (n.includes('charm')) return '../images/charm.png';
    return null; // no matching photo -> render a placeholder icon instead
}

function inferCustomizeType(name) {
    const n = name.toLowerCase();
    if (n.includes('leather')) return 'leather';
    if (n.includes('bead')) return 'beaded';
    if (n.includes('charm')) return 'charm';
    return n.replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '') || 'custom';
}

function productCardHtml(product) {
    const img = inferImage(product.name);
    const imgHtml = img
        ? `<img src="${img}" alt="${product.name}">`
        : `<i class="fa-solid fa-gift" style="font-size:3rem;color:var(--price);"></i>`;

    const outOfStock = Number(product.stock) <= 0;
    const badgeHtml = product.name.toLowerCase().includes('bear')
        ? `<span class="badge">Bestseller</span>`
        : '';

    const actionBtn = product.custom === 'Yes'
        ? `<button class="btn-brown" onclick="window.location.href='customizePage.html?type=${inferCustomizeType(product.name)}'">
             <i class="fa-solid fa-wand-magic-sparkles"></i> Customize
           </button>`
        : `<button class="btn-brown" data-action="add-cart" data-id="${product.id}" ${outOfStock ? 'disabled style="opacity:.5;cursor:not-allowed;"' : ''}>
             <i class="fa-solid fa-cart-plus"></i> ${outOfStock ? 'Out of Stock' : 'Add To Cart'}
           </button>`;

    return `
    <div class="product-card">
        ${badgeHtml}
        <div class="product-img">
            ${imgHtml}
        </div>
        <div class="product-info">
            <div class="product-top">
                <h2>${product.name}</h2>
                <span class="product-price">${Number(product.price).toFixed(2)} PHP</span>
            </div>
            <p>${product.description || ''}</p>
            ${actionBtn}
        </div>
    </div>`;
}

function renderProductCards() {
    const container = document.getElementById('productsContainer');
    const products = getProducts().filter(p => p.visible === 'Shown');

    if (products.length === 0) {
        container.innerHTML = `<p style="text-align:center;color:var(--text-brown-light);">No products available right now — check back soon!</p>`;
        return;
    }

    container.innerHTML = products.map(productCardHtml).join('');
}

// Event delegation: catches clicks on any "Add To Cart" button, including
// ones rendered after the page first loads.
document.getElementById('productsContainer').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-action="add-cart"]');
    if (!btn || btn.disabled) return;

    const products = getProducts();
    const product = products.find(p => String(p.id) === btn.dataset.id);
    if (!product) return;

    addToCart({
        id: 'product-' + product.id,
        name: product.name,
        price: product.price,
        qty: 1,
        quantity: 1,
        customizable: false
    });
});

renderProductCards();
</script>

</body>
</html>
