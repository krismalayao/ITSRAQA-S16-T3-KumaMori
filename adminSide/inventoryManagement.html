<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KumaMori - Inventory Management</title>
  <link rel="icon" type="image/png" sizes="48x48" href="../images/kumamoriFavicon.png">

  <!-- Google Fonts: Fredoka -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --admin-bg: #faf6f4;
      --sidebar-bg: #f9e2e6;
      --sidebar-border: #e8bdc5;
      --card-bg: #ffffff;
      --card-border: #f0c2cb;
      --text-brown: #5c3214;
      --text-muted: #8c6853;
      --highlight-active: #eed1d7;

      /* Status Colors */
      --status-in-stock-bg: #dcfce7;
      --status-in-stock-text: #15803d;
      --status-low-stock-bg: #fef9c3;
      --status-low-stock-text: #a16207;
      --status-out-stock-bg: #fee2e2;
      --status-out-stock-text: #b91c1c;
    }

     /* Hide scrollbar for Chrome, Safari, Edge, Opera */
    ::-webkit-scrollbar {
    display: none;
    }

    /* Hide scrollbar for IE, Firefox */
    html, body, * {
    -ms-overflow-style: none;  /* IE and Edge */
    scrollbar-width: none;  /* Firefox */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Fredoka', sans-serif;
    }

    body {
      min-height: 100vh;
      background-color: var(--admin-bg);
      display: flex;
      overflow-x: hidden;
    }

    /* -------------------------------------------------------------------------- */
    /* Sidebar Navigation                                                         */
    /* -------------------------------------------------------------------------- */
    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      width: 250px;
      background-color: var(--sidebar-bg);
      border-right: 2px solid var(--sidebar-border);
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex-shrink: 0;
      box-shadow: 4px 0 20px rgba(92, 50, 20, 0.06);
      z-index: 100;
      transition: all 0.3s ease;
    }

    .brand-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 30px;
    }

    .logo-img {
      max-width: 150px;
      height: auto;
      object-fit: contain;
    }

    .menu-toggle {
      display: none;
      background: none;
      border: none;
      font-size: 1.8rem;
      color: var(--text-brown);
      cursor: pointer;
      padding: 5px;
    }

    .nav-container {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
    }

    .nav-menu {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .nav-item a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 18px;
      border-radius: 20px;
      color: var(--text-brown);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    .nav-item a:hover {
      background-color: var(--highlight-active);
    }

    .nav-item.active a {
      background-color: var(--text-brown);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(92, 50, 20, 0.2);
    }

    .logout-btn {
      color: #d9534f !important;
    }

    .logout-btn:hover {
      background-color: #d9534f !important;
      color: #ffffff !important;
    }

    /* -------------------------------------------------------------------------- */
    /* Main Content Area                                                          */
    /* -------------------------------------------------------------------------- */
    .main-content {
      flex: 1;
      padding: 40px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 1200px;
      width: 100%;
      min-width: 0;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .header-title {
      font-size: 2rem;
      color: var(--text-brown);
      font-weight: 700;
    }

    .btn-add {
      background-color: var(--text-brown);
      color: #ffffff;
      border: none;
      padding: 12px 24px;
      border-radius: 25px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(92, 50, 20, 0.2);
      transition: transform 0.2s, background-color 0.2s;
    }

    .btn-add:hover {
      transform: translateY(-2px);
      background-color: #42220b;
    }

    /* Search & Filter Controls */
    .filter-bar {
      display: flex;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
    }

    .search-input, .filter-select {
      padding: 10px 18px;
      border-radius: 20px;
      border: 2px solid var(--card-border);
      background-color: var(--card-bg);
      color: var(--text-brown);
      font-weight: 500;
      font-size: 0.9rem;
      outline: none;
    }

    .search-input {
      flex: 1;
      min-width: 220px;
    }

    .search-input:focus, .filter-select:focus {
      border-color: var(--text-brown);
    }

    /* -------------------------------------------------------------------------- */
    /* Card-Style Inventory Table                                                 */
    /* -------------------------------------------------------------------------- */
    .table-container {
      width: 100%;
      overflow-x: auto;
    }

    .inventory-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 12px;
    }

    .inventory-table thead tr {
      background-color: #f9e2e6;
    }

    .inventory-table th {
      padding: 16px 20px;
      color: var(--text-brown);
      font-size: 0.9rem;
      font-weight: 600;
      text-align: left;
    }

    .inventory-table th:first-child {
      border-top-left-radius: 20px;
      border-bottom-left-radius: 20px;
    }

    .inventory-table th:last-child {
      border-top-right-radius: 20px;
      border-bottom-right-radius: 20px;
    }

    .inventory-table tbody tr {
      background-color: var(--card-bg);
      box-shadow: 0 4px 15px rgba(92, 50, 20, 0.05);
      transition: transform 0.2s;
    }

    .inventory-table tbody tr:hover {
      transform: translateY(-2px);
    }

    .inventory-table td {
      padding: 18px 20px;
      color: var(--text-brown);
      font-weight: 500;
      font-size: 0.95rem;
      vertical-align: middle;
      border-top: 1px solid var(--card-border);
      border-bottom: 1px solid var(--card-border);
    }

    .inventory-table td:first-child {
      border-left: 1px solid var(--card-border);
      border-top-left-radius: 20px;
      border-bottom-left-radius: 20px;
      font-weight: 700;
    }

    .inventory-table td:last-child {
      border-right: 1px solid var(--card-border);
      border-top-right-radius: 20px;
      border-bottom-right-radius: 20px;
    }

    /* Status Badges */
    .status-badge {
      padding: 6px 14px;
      border-radius: 15px;
      font-size: 0.8rem;
      font-weight: 600;
      display: inline-block;
    }

    .status-badge.in-stock {
      background-color: var(--status-in-stock-bg);
      color: var(--status-in-stock-text);
    }

    .status-badge.low-stock {
      background-color: var(--status-low-stock-bg);
      color: var(--status-low-stock-text);
    }

    .status-badge.out-stock {
      background-color: var(--status-out-stock-bg);
      color: var(--status-out-stock-text);
    }

    /* Icon Action Buttons */
    .action-btns {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: flex-start;
    }

    .btn-icon {
      background-color: #f7e8eb;
      border: none;
      cursor: pointer;
      padding: 8px;
      border-radius: 12px;
      color: var(--text-brown);
      transition: background-color 0.2s, transform 0.1s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-icon:hover {
      background-color: #eed1d7;
      transform: scale(1.05);
    }

    .btn-icon.danger {
      background-color: #fce8e8;
      color: #d9534f;
    }

    .btn-icon.danger:hover {
      background-color: #f8d7da;
    }

    /* -------------------------------------------------------------------------- */
    /* Modal Forms Styling                                                        */
    /* -------------------------------------------------------------------------- */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(92, 50, 20, 0.4);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-card {
      background-color: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 28px;
      width: 100%;
      max-width: 480px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-title {
      color: var(--text-brown);
      font-size: 1.4rem;
      font-weight: 700;
    }

    .btn-close {
      background: none;
      border: none;
      font-size: 1.5rem;
      color: var(--text-muted);
      cursor: pointer;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 14px;
    }

    .form-row {
      display: flex;
      gap: 12px;
    }

    .form-row .form-group {
      flex: 1;
    }

    .form-group label {
      color: var(--text-brown);
      font-size: 0.85rem;
      font-weight: 600;
    }

    .form-group input, .form-group select {
      padding: 10px 14px;
      border-radius: 12px;
      border: 2px solid var(--card-border);
      outline: none;
      font-size: 0.9rem;
      color: var(--text-brown);
    }

    .form-group input:focus, .form-group select:focus {
      border-color: var(--text-brown);
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 24px;
    }

    .btn-save {
      flex: 1;
      background-color: var(--text-brown);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 18px;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-danger-confirm {
      flex: 1;
      background-color: #d9534f;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-danger-confirm:hover {
      background-color: #c9302c;
    }

    .btn-cancel {
      flex: 1;
      background-color: #f7e8eb;
      color: var(--text-brown);
      border: none;
      padding: 12px;
      border-radius: 18px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Delete Confirmation Text */
    .delete-text {
      color: var(--text-brown);
      font-size: 1.05rem;
      line-height: 1.5;
      text-align: center;
      margin: 15px 0;
    }

    /* Mobile Breakpoints */
    @media (max-width: 768px) {
      body {
        flex-direction: column;
      }

      .sidebar {
        position: sticky;
        top: 0;
        width: 100%;
        height: auto;
        border-right: none;
        border-bottom: 2px solid var(--sidebar-border);
        padding: 15px 20px;
      }

      .brand-section {
        margin-bottom: 0;
      }

      .logo-img {
        max-width: 120px;
      }

      .menu-toggle {
        display: block;
      }

      .nav-container {
        display: none;
        flex-direction: column;
        gap: 15px;
        margin-top: 15px;
        padding-top: 15px;
        border-top: 1px solid var(--sidebar-border);
      }

      .nav-container.open {
        display: flex;
      }

      .main-content {
        padding: 20px 15px;
      }

      .header-title {
        font-size: 1.6rem;
      }

      .filter-bar {
        width: 100%;
      }

      .search-input {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- Responsive Sidebar -->
  <aside class="sidebar">
    <div class="brand-section">
      <img src="../images/publicPages.png" alt="KumaMori Logo" class="logo-img">
      <button class="menu-toggle" id="menuToggle" aria-label="Toggle Navigation">☰</button>
    </div>

    <div class="nav-container" id="navContainer">
      <ul class="nav-menu">
        <li class="nav-item"><a href="adminDashboard.html">Analytics</a></li>
        <li class="nav-item active"><a href="inventoryManagement.html">Inventory</a></li>
        <li class="nav-item"><a href="productManagement.html">Products</a></li>
        <li class="nav-item"><a href="salesManagement.html">Sales</a></li>
        <li class="nav-item"><a href="profilePage.html">Profile</a></li>
      </ul>

      <ul class="nav-menu" style="margin-top: 15px;">
        <li class="nav-item"><a href="../publicPages/loginPage.html" class="logout-btn" id="logoutBtn">Log Out</a></li>
      </ul>
    </div>
  </aside>

  <!-- Main Content Area -->
  <main class="main-content">
    
    <div class="top-bar">
      <h1 class="header-title">Inventory Management</h1>
      <button class="btn-add" id="openAddModalBtn">+ Add Material Stock</button>
    </div>

    <!-- Search/Filter Controls -->
    <div class="filter-bar">
      <input type="text" id="searchInput" class="search-input" placeholder="Search material name or option...">
      <select id="categoryFilter" class="filter-select">
        <option value="All">All Categories</option>
        <option value="Beads">Beads</option>
        <option value="Letters & Charms">Letters & Charms</option>
        <option value="Leather Straps">Leather Straps</option>
        <option value="Letter Accents">Letter Accents</option>
        <option value="Spacers">Spacers</option>
        <option value="Moon Charms">Moon Charms</option>
        <option value="Charms">Charms</option>
        <option value="Figurines">Figurines</option>
        <option value="Pendants">Pendants</option>
        <option value="Hardware & Clasps">Hardware & Clasps</option>
        <option value="Straps & Cords">Straps & Cords</option>
        <option value="Packaging">Packaging</option>
      </select>
    </div>

    <!-- Inventory Data Table -->
    <div class="table-container">
      <table class="inventory-table">
        <thead>
          <tr>
            <th>Material / Option Name</th>
            <th>Category</th>
            <th>Stock Level</th>
            <th>Unit</th>
            <th>Min Threshold</th>
            <th>Status</th>
            <th>Last Updated</th>
            <th style="text-align: left;">Actions</th>
          </tr>
        </thead>
        <tbody id="inventoryTableBody">
        </tbody>
      </table>
    </div>
  </main>

  <!-- Add/Edit Material Stock Modal -->
  <div class="modal-overlay" id="stockModal">
    <div class="modal-card">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle">Add New Material Stock</h2>
        <button class="btn-close" id="closeModalBtn">&times;</button>
      </div>

      <form id="stockForm">
        <div class="form-group">
          <label for="materialName">Material / Option Name</label>
          <input type="text" id="materialName" required placeholder="e.g. Letter Bead - 'A'">
        </div>

        <div class="form-group">
          <label for="materialCategory">Category</label>
          <select id="materialCategory" required>
            <option value="Beads">Beads</option>
            <option value="Letters & Charms">Letters & Charms</option>
            <option value="Leather Straps">Leather Straps</option>
            <option value="Letter Accents">Letter Accents</option>
            <option value="Spacers">Spacers</option>
            <option value="Moon Charms">Moon Charms</option>
            <option value="Charms">Charms</option>
            <option value="Figurines">Figurines</option>
            <option value="Pendants">Pendants</option>
            <option value="Hardware & Clasps">Hardware & Clasps</option>
            <option value="Straps & Cords">Straps & Cords</option>
            <option value="Packaging">Packaging</option>
          </select>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="stockQuantity">Stock Quantity</label>
            <input type="number" id="stockQuantity" min="0" required placeholder="0">
          </div>

          <div class="form-group">
            <label for="unitMeasure">Unit</label>
            <select id="unitMeasure" required>
              <option value="pcs">pcs</option>
              <option value="meters">meters</option>
              <option value="grams">grams</option>
              <option value="packs">packs</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="minThreshold">Min Threshold (Low Stock Alert)</label>
          <input type="number" id="minThreshold" min="1" value="10" required placeholder="10">
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-cancel" id="cancelModalBtn">Cancel</button>
          <button type="submit" class="btn-save">Save Material</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Delete Confirmation Pop-up Modal -->
  <div class="modal-overlay" id="deleteModal">
    <div class="modal-card">
      <div class="modal-header">
        <h2 class="modal-title">Delete Material</h2>
        <button class="btn-close" id="closeDeleteModalBtn">&times;</button>
      </div>
      
      <p class="delete-text">
        Are you sure you want to delete <strong id="deleteItemName" style="color: #d9534f;"></strong>?
      </p>

      <div class="modal-actions">
        <button type="button" class="btn-cancel" id="cancelDeleteBtn">Cancel</button>
        <button type="button" class="btn-danger-confirm" id="confirmDeleteBtn">Delete</button>
      </div>
    </div>
  </div>

  <!-- Interactive Scripts -->
  <script src="../auth.js"></script>
  <script>
    const currentAdmin = requireAdmin();
    let activeEditingId = null; // id of the item currently being edited, or null when adding

    function statusBadgeHtml(status) {
      if (status === 'out-stock') return '<span class="status-badge out-stock">Out of Stock</span>';
      if (status === 'low-stock') return '<span class="status-badge low-stock">Low Stock</span>';
      return '<span class="status-badge in-stock">In Stock</span>';
    }

    function computeStatus(stock, minThreshold) {
      if (stock === 0) return 'out-stock';
      if (stock <= minThreshold) return 'low-stock';
      return 'in-stock';
    }

    // Rebuilds the whole table body from whatever is currently in localStorage
    function renderInventory() {
      const items = getInventory();
      const tbody = document.getElementById('inventoryTableBody');
      tbody.innerHTML = items.map(item => `
        <tr data-id="${item.id}">
          <td>${item.name}</td>
          <td>${item.category}</td>
          <td>${item.stock}</td>
          <td>${item.unit}</td>
          <td>${item.minThreshold}</td>
          <td>${statusBadgeHtml(item.status)}</td>
          <td>${item.updated}</td>
          <td>
            <div class="action-btns">
              <button class="btn-icon" title="Edit Item" onclick="openEditModal(this)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
              </button>
              <button class="btn-icon danger" title="Delete Item" onclick="promptDelete(this)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
              </button>
            </div>
          </td>
        </tr>
      `).join('');
      filterTable();
    }

    // Filter and Search Logic (kept as a top-level function so it can be
    // called again right after a re-render)
    function filterTable() {
      const searchInput = document.getElementById('searchInput');
      const categoryFilter = document.getElementById('categoryFilter');
      const query = searchInput.value.toLowerCase();
      const category = categoryFilter.value;
      const rows = document.querySelectorAll('#inventoryTableBody tr');

      rows.forEach(row => {
        const name = row.cells[0].textContent.toLowerCase();
        const rowCategory = row.cells[1].textContent;

        const matchesSearch = name.includes(query);
        const matchesCategory = (category === 'All' || rowCategory === category);

        row.style.display = (matchesSearch && matchesCategory) ? '' : 'none';
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (!currentAdmin) return; // already redirecting to login

      document.getElementById('logoutBtn').addEventListener('click', () => {
        clearSession();
      });

      // Mobile Drawer Toggle
      const menuToggle = document.getElementById('menuToggle');
      const navContainer = document.getElementById('navContainer');
      menuToggle.addEventListener('click', () => {
        navContainer.classList.toggle('open');
      });

      renderInventory();

      // Stock Add/Edit Modal Controls
      const stockModal = document.getElementById('stockModal');
      const openAddModalBtn = document.getElementById('openAddModalBtn');
      const closeModalBtn = document.getElementById('closeModalBtn');
      const cancelModalBtn = document.getElementById('cancelModalBtn');
      const modalTitle = document.getElementById('modalTitle');
      const stockForm = document.getElementById('stockForm');

      openAddModalBtn.addEventListener('click', () => {
        activeEditingId = null;
        modalTitle.textContent = "Add New Material Stock";
        stockForm.reset();
        stockModal.classList.add('open');
      });

      const closeModal = () => stockModal.classList.remove('open');
      closeModalBtn.addEventListener('click', closeModal);
      cancelModalBtn.addEventListener('click', closeModal);

      // Submit Form Logic -> always writes through to localStorage
      stockForm.addEventListener('submit', (e) => {
        e.preventDefault();

        const name = document.getElementById('materialName').value.trim();
        const category = document.getElementById('materialCategory').value;
        const stock = parseInt(document.getElementById('stockQuantity').value);
        const unit = document.getElementById('unitMeasure').value;
        const minThreshold = parseInt(document.getElementById('minThreshold').value);
        const status = computeStatus(stock, minThreshold);
        const today = new Date().toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });

        const items = getInventory();

        if (activeEditingId !== null) {
          // UPDATE EXISTING ITEM
          const idx = items.findIndex(i => i.id === activeEditingId);
          if (idx !== -1) {
            items[idx] = { ...items[idx], name, category, stock, unit, minThreshold, status, updated: today };
          }
        } else {
          // ADD NEW ITEM
          const nextId = items.length ? Math.max(...items.map(i => i.id)) + 1 : 1;
          items.unshift({ id: nextId, name, category, stock, unit, minThreshold, status, updated: today });
        }

        saveInventory(items);
        renderInventory();
        closeModal();
      });

      // Filter and Search Logic
      const searchInput = document.getElementById('searchInput');
      const categoryFilter = document.getElementById('categoryFilter');
      searchInput.addEventListener('input', filterTable);
      categoryFilter.addEventListener('change', filterTable);

      // Delete Modal Controls
      const deleteModal = document.getElementById('deleteModal');
      const closeDeleteModalBtn = document.getElementById('closeDeleteModalBtn');
      const cancelDeleteBtn = document.getElementById('cancelDeleteBtn');
      const confirmDeleteBtn = document.getElementById('confirmDeleteBtn');

      const closeDeleteModal = () => deleteModal.classList.remove('open');
      closeDeleteModalBtn.addEventListener('click', closeDeleteModal);
      cancelDeleteBtn.addEventListener('click', closeDeleteModal);

      confirmDeleteBtn.addEventListener('click', () => {
        if (window.idToDelete !== null && window.idToDelete !== undefined) {
          const items = getInventory().filter(i => i.id !== window.idToDelete);
          saveInventory(items);
          renderInventory();
          window.idToDelete = null;
        }
        closeDeleteModal();
      });
    });

    function openEditModal(btn) {
      const row = btn.closest('tr');
      const id = parseInt(row.dataset.id);
      const item = getInventory().find(i => i.id === id);
      if (!item) return;

      activeEditingId = id;

      document.getElementById('modalTitle').textContent = "Update Material Stock";
      document.getElementById('materialName').value = item.name;
      document.getElementById('materialCategory').value = item.category;
      document.getElementById('stockQuantity').value = item.stock;
      document.getElementById('unitMeasure').value = item.unit;
      document.getElementById('minThreshold').value = item.minThreshold;

      document.getElementById('stockModal').classList.add('open');
    }

    function promptDelete(btn) {
      const deleteModal = document.getElementById('deleteModal');
      const row = btn.closest('tr');
      const id = parseInt(row.dataset.id);
      const item = getInventory().find(i => i.id === id);

      document.getElementById('deleteItemName').textContent = item ? `'${item.name}'` : '';
      window.idToDelete = id;
      deleteModal.classList.add('open');
    }
  </script>
</body>
</html>
