<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KumaMori - Product Management</title>
  <link rel="icon" type="image/png" sizes="48x48" href="../images/kumamoriFavicon.png">

  <!-- Google Fonts: Fredoka -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --admin-bg: #faf6f4;
      --sidebar-bg: #f9e2e6;
      --sidebar-border: #e8bdc5;
      --card-bg: #ffffff;
      --card-border: #f0c2cb;
      --text-brown: #5c3214;
      --text-muted: #8c6853;
      --highlight-active: #eed1d7;

      /* Scrollbar Theme Variables */
      --scrollbar-track: #fceee9;
      --scrollbar-thumb: #8c6853;
      --scrollbar-thumb-hover: #5c3214;

      /* Status Colors */
      --status-shown-bg: #dcfce7;
      --status-shown-text: #15803d;
      --status-hidden-bg: #f3f4f6;
      --status-hidden-text: #4b5563;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Fredoka', sans-serif;
    }

    /* Custom Scrollbars */
    ::-webkit-scrollbar {
      width: 10px;
      height: 10px;
    }

    ::-webkit-scrollbar-track {
      background: var(--scrollbar-track);
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--scrollbar-thumb);
      border-radius: 10px;
      border: 2px solid var(--scrollbar-track);
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--scrollbar-thumb-hover);
    }

    * {
      scrollbar-width: thin;
      scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track);
    }

    body {
      min-height: 100vh;
      background-color: var(--admin-bg);
      display: flex;
      overflow-x: hidden;
    }

    /* Sidebar Navigation */
    .sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      width: 250px;
      background-color: var(--sidebar-bg);
      border-right: 2px solid var(--sidebar-border);
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex-shrink: 0;
      box-shadow: 4px 0 20px rgba(92, 50, 20, 0.06);
      z-index: 100;
      transition: all 0.3s ease;
    }

    .brand-section {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 30px;
    }

    .logo-img {
      max-width: 150px;
      height: auto;
      object-fit: contain;
    }

    .menu-toggle {
      display: none;
      background: none;
      border: none;
      font-size: 1.8rem;
      color: var(--text-brown);
      cursor: pointer;
      padding: 5px;
    }

    .nav-container {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100%;
    }

    .nav-menu {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .nav-item a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 18px;
      border-radius: 20px;
      color: var(--text-brown);
      text-decoration: none;
      font-weight: 600;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    .nav-item a:hover {
      background-color: var(--highlight-active);
    }

    .nav-item.active a {
      background-color: var(--text-brown);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(92, 50, 20, 0.2);
    }

    .logout-btn {
      color: #d9534f !important;
    }

    .logout-btn:hover {
      background-color: #d9534f !important;
      color: #ffffff !important;
    }

    /* Main Content */
    .main-content {
      flex: 1;
      padding: 40px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      max-width: 1200px;
      width: 100%;
      min-width: 0;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .header-title {
      font-size: 2rem;
      color: var(--text-brown);
      font-weight: 700;
    }

    .btn-add {
      background-color: var(--text-brown);
      color: #ffffff;
      border: none;
      padding: 12px 24px;
      border-radius: 25px;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(92, 50, 20, 0.2);
      transition: transform 0.2s, background-color 0.2s;
    }

    .btn-add:hover {
      transform: translateY(-2px);
      background-color: #42220b;
    }

    /* Filters */
    .filter-bar {
      display: flex;
      gap: 15px;
      align-items: center;
      flex-wrap: wrap;
    }

    .search-input, .filter-select {
      padding: 10px 18px;
      border-radius: 20px;
      border: 2px solid var(--card-border);
      background-color: var(--card-bg);
      color: var(--text-brown);
      font-weight: 500;
      font-size: 0.9rem;
      outline: none;
    }

    .search-input {
      flex: 1;
      min-width: 220px;
    }

    .search-input:focus, .filter-select:focus {
      border-color: var(--text-brown);
    }

    /* Table */
    .table-container {
      width: 100%;
      overflow-x: auto;
    }

    .products-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 12px;
    }

    .products-table thead tr {
      background-color: #f9e2e6;
    }

    .products-table th {
      padding: 16px 20px;
      color: var(--text-brown);
      font-size: 0.9rem;
      font-weight: 600;
      text-align: left;
    }

    .products-table th:first-child {
      border-top-left-radius: 20px;
      border-bottom-left-radius: 20px;
    }

    .products-table th:last-child {
      border-top-right-radius: 20px;
      border-bottom-right-radius: 20px;
    }

    .products-table tbody tr {
      background-color: var(--card-bg);
      box-shadow: 0 4px 15px rgba(92, 50, 20, 0.05);
      transition: transform 0.2s;
    }

    .products-table tbody tr:hover {
      transform: translateY(-2px);
    }

    .products-table td {
      padding: 18px 20px;
      color: var(--text-brown);
      font-weight: 500;
      font-size: 0.95rem;
      vertical-align: middle;
      border-top: 1px solid var(--card-border);
      border-bottom: 1px solid var(--card-border);
    }

    .products-table td:first-child {
      border-left: 1px solid var(--card-border);
      border-top-left-radius: 20px;
      border-bottom-left-radius: 20px;
      font-weight: 700;
    }

    .products-table td:last-child {
      border-right: 1px solid var(--card-border);
      border-top-right-radius: 20px;
      border-bottom-right-radius: 20px;
    }

    .visibility-badge {
      padding: 6px 14px;
      border-radius: 15px;
      font-size: 0.8rem;
      font-weight: 600;
      display: inline-block;
    }

    .visibility-badge.shown {
      background-color: var(--status-shown-bg);
      color: var(--status-shown-text);
    }

    .visibility-badge.hidden {
      background-color: var(--status-hidden-bg);
      color: var(--status-hidden-text);
    }

    .action-btns {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: flex-start;
    }

    .btn-icon {
      background-color: #f7e8eb;
      border: none;
      cursor: pointer;
      padding: 8px;
      border-radius: 12px;
      color: var(--text-brown);
      transition: background-color 0.2s, transform 0.1s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-icon:hover {
      background-color: #eed1d7;
      transform: scale(1.05);
    }

    .btn-icon.danger {
      background-color: #fce8e8;
      color: #d9534f;
    }

    .btn-icon.danger:hover {
      background-color: #f8d7da;
    }

    /* Modal Form Styling */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(92, 50, 20, 0.4);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-card {
      background-color: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 28px;
      width: 100%;
      max-width: 500px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
      max-height: 90vh;
      overflow-y: auto;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-title {
      color: var(--text-brown);
      font-size: 1.4rem;
      font-weight: 700;
    }

    .btn-close {
      background: none;
      border: none;
      font-size: 1.5rem;
      color: var(--text-muted);
      cursor: pointer;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }

    .form-group.full-width {
      grid-column: span 2;
    }

    .form-group label {
      color: var(--text-brown);
      font-size: 0.85rem;
      font-weight: 600;
    }

    .form-group input, .form-group select, .form-group textarea {
      padding: 10px 14px;
      border-radius: 12px;
      border: 2px solid var(--card-border);
      outline: none;
      font-size: 0.9rem;
      color: var(--text-brown);
    }

    .form-group textarea {
      resize: vertical;
      min-height: 70px;
    }

    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      border-color: var(--text-brown);
    }

    .custom-file-input {
      display: none;
    }

    .custom-file-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 12px 18px;
      border: 2px dashed var(--card-border);
      border-radius: 16px;
      background-color: #fdf3dd;
      color: var(--text-brown);
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
    }

    .custom-file-btn:hover {
      background-color: #fae8c4;
      border-color: var(--text-brown);
    }

    .file-info-badge {
      display: none;
      align-items: center;
      justify-content: space-between;
      background-color: #f9e2e6;
      border: 1px solid var(--card-border);
      padding: 8px 14px;
      border-radius: 12px;
      margin-top: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-brown);
    }

    .file-info-badge span {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 85%;
    }

    .file-info-badge button {
      background: none;
      border: none;
      color: #d9534f;
      cursor: pointer;
      font-size: 1rem;
    }

    .image-preview-container {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .image-preview {
      width: 100%;
      max-height: 180px;
      object-fit: contain;
      border-radius: 16px;
      border: 2px solid var(--card-border);
      background-color: #faf6f4;
      padding: 8px;
      display: none;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .btn-save {
      flex: 1;
      background-color: var(--text-brown);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-save:hover {
      background-color: #42220b;
    }

    .btn-danger-confirm {
      flex: 1;
      background-color: #d9534f;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn-danger-confirm:hover {
      background-color: #c9302c;
    }

    .btn-cancel {
      flex: 1;
      background-color: #f7e8eb;
      color: var(--text-brown);
      border: none;
      padding: 12px;
      border-radius: 18px;
      font-weight: 600;
      cursor: pointer;
    }

    .delete-text {
      color: var(--text-brown);
      font-size: 1.05rem;
      line-height: 1.5;
      text-align: center;
      margin: 15px 0;
    }

    @media (max-width: 768px) {
      body {
        flex-direction: column;
      }

      .sidebar {
        position: sticky;
        top: 0;
        width: 100%;
        height: auto;
        border-right: none;
        border-bottom: 2px solid var(--sidebar-border);
        padding: 15px 20px;
      }

      .brand-section {
        margin-bottom: 0;
      }

      .logo-img {
        max-width: 120px;
      }

      .menu-toggle {
        display: block;
      }

      .nav-container {
        display: none;
        flex-direction: column;
        gap: 15px;
        margin-top: 15px;
        padding-top: 15px;
        border-top: 1px solid var(--sidebar-border);
      }

      .nav-container.open {
        display: flex;
      }

      .main-content {
        padding: 20px 15px;
      }

      .header-title {
        font-size: 1.6rem;
      }

      .filter-bar {
        width: 100%;
      }

      .search-input {
        width: 100%;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-group.full-width {
        grid-column: span 1;
      }
    }
  </style>
</head>
<body>

  <!-- Responsive Sidebar -->
  <aside class="sidebar">
    <div class="brand-section">
      <img src="../images/publicPages.png" alt="KumaMori Logo" class="logo-img">
      <button class="menu-toggle" id="menuToggle" aria-label="Toggle Navigation">☰</button>
    </div>

    <div class="nav-container" id="navContainer">
      <ul class="nav-menu">
        <li class="nav-item"><a href="adminDashboard.html">Analytics</a></li>
        <li class="nav-item"><a href="inventoryManagement.html">Inventory</a></li>
        <li class="nav-item active"><a href="productManagement.html">Products</a></li>
        <li class="nav-item"><a href="salesManagement.html">Sales</a></li>
        <li class="nav-item"><a href="profilePage.html">Profile</a></li>
      </ul>

      <ul class="nav-menu" style="margin-top: 15px;">
        <li class="nav-item"><a href="../publicPages/loginPage.html" class="logout-btn" id="logoutBtn">Log Out</a></li>
      </ul>
    </div>
  </aside>

  <!-- Main Content Area -->
  <main class="main-content">
    
    <div class="top-bar">
      <h1 class="header-title">Products Management</h1>
      <button class="btn-add" id="openAddModalBtn">+ Add Product</button>
    </div>

    <div class="filter-bar">
      <input type="text" id="searchInput" class="search-input" placeholder="Search product name...">
      <select id="customFilter" class="filter-select">
        <option value="All">All Types</option>
        <option value="Yes">Customizable Only</option>
        <option value="No">Non-Customizable</option>
      </select>
      <select id="visibleFilter" class="filter-select">
        <option value="All">All Visibility</option>
        <option value="Shown">Shown</option>
        <option value="Hidden">Hidden</option>
      </select>
    </div>

    <div class="table-container">
      <table class="products-table">
        <thead>
          <tr>
            <th>Product</th>
            <th>Price</th>
            <th>Stock</th>
            <th>Bestseller</th>
            <th>Visible</th>
            <th>Custom</th>
            <th style="text-align: left;">Actions</th>
          </tr>
        </thead>
        <tbody id="productsTableBody">
        </tbody>
      </table>
    </div>
  </main>

  <!-- Modal Form -->
  <div class="modal-overlay" id="productModal">
    <div class="modal-card">
      <div class="modal-header">
        <h2 class="modal-title" id="modalTitle">Add New Product</h2>
        <button class="btn-close" id="closeModalBtn">&times;</button>
      </div>

      <form id="productForm">
        <div class="form-grid">
          <div class="form-group full-width">
            <label for="productName">Name</label>
            <input type="text" id="productName" required placeholder="e.g. Plush Bear">
          </div>

          <div class="form-group">
            <label for="productPrice">Price (PHP)</label>
            <input type="number" id="productPrice" min="0" step="0.01" required placeholder="0.00">
          </div>

          <div class="form-group">
            <label for="productStock">Stock</label>
            <input type="number" id="productStock" min="0" required placeholder="0">
          </div>

          <div class="form-group full-width">
            <label for="productDescription">Description</label>
            <textarea id="productDescription" placeholder="Enter product details..."></textarea>
          </div>

          <div class="form-group full-width">
            <label>Product Image (PNG or JPG)</label>
            
            <input type="file" id="productImage" class="custom-file-input" accept="image/png, image/jpeg">
            <label for="productImage" class="custom-file-btn">
              <i class="fa-solid fa-cloud-arrow-up"></i>
              <span>Choose Image...</span>
            </label>

            <div id="fileInfoBadge" class="file-info-badge">
              <span id="fileNameText">filename.png</span>
              <button type="button" onclick="resetImagePreview()" title="Remove image">&times;</button>
            </div>

            <div class="image-preview-container">
              <img id="imgPreview" class="image-preview" src="" alt="Image Preview">
            </div>
          </div>

          <div class="form-group">
            <label for="productBestseller">Bestseller?</label>
            <select id="productBestseller" required>
              <option value="No">No</option>
              <option value="Yes">Yes</option>
            </select>
          </div>

          <div class="form-group">
            <label for="productCustom">Custom Toggle</label>
            <select id="productCustom" required>
              <option value="No">No</option>
              <option value="Yes">Yes</option>
            </select>
          </div>

          <div class="form-group full-width">
            <label for="productVisible">Visibility</label>
            <select id="productVisible" required>
              <option value="Shown">Shown</option>
              <option value="Hidden">Hidden</option>
            </select>
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" class="btn-cancel" id="cancelModalBtn">Cancel</button>
          <button type="submit" class="btn-save">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Delete Modal -->
  <div class="modal-overlay" id="deleteModal">
    <div class="modal-card">
      <div class="modal-header">
        <h2 class="modal-title">Remove Product</h2>
        <button class="btn-close" id="closeDeleteModalBtn">&times;</button>
      </div>
      
      <p class="delete-text">
        Are you sure you want to remove <strong id="deleteItemName" style="color: #d9534f;"></strong>?
      </p>

      <div class="modal-actions">
        <button type="button" class="btn-cancel" id="cancelDeleteBtn">Cancel</button>
        <button type="button" class="btn-danger-confirm" id="confirmDeleteBtn">Remove</button>
      </div>
    </div>
  </div>

  <script src="../auth.js"></script>
  <script>
    const currentAdmin = requireAdmin();
    let activeEditingId = null; 
    let isImageRemoved = false; 

    function visibilityBadgeHtml(visible) {
      return visible === 'Shown'
        ? '<span class="visibility-badge shown">Shown</span>'
        : '<span class="visibility-badge hidden">Hidden</span>';
    }

    function renderProducts() {
      const items = getProducts();
      const tbody = document.getElementById('productsTableBody');
      tbody.innerHTML = items.map(item => `
        <tr data-id="${item.id}" data-description="${(item.description || '').replace(/"/g, '&quot;')}">
          <td>${item.name}</td>
          <td>PHP ${item.price}</td>
          <td>${(item.stock === null || item.stock === undefined) ? 'Made-to-order' : item.stock}</td>
          <td>${item.bestseller || (item.name.toLowerCase().includes('bear') ? 'Yes' : 'No')}</td>
          <td>${visibilityBadgeHtml(item.visible)}</td>
          <td>${item.custom}</td>
          <td>
            <div class="action-btns">
              <button class="btn-icon" title="Edit Item" onclick="openEditModal(this)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
              </button>
              <button class="btn-icon danger" title="Remove Item" onclick="promptDelete(this)">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
              </button>
            </div>
          </td>
        </tr>
      `).join('');
      filterTable();
    }

    function filterTable() {
      const searchInput = document.getElementById('searchInput');
      const customFilter = document.getElementById('customFilter');
      const visibleFilter = document.getElementById('visibleFilter');
      const query = searchInput.value.toLowerCase();
      const customVal = customFilter.value;
      const visibleVal = visibleFilter.value;
      const rows = document.querySelectorAll('#productsTableBody tr');

      rows.forEach(row => {
        const name = row.cells[0].textContent.toLowerCase();
        const isVisible = row.cells[4].textContent.trim();
        const isCustom = row.cells[5].textContent.trim();

        const matchesSearch = name.includes(query);
        const matchesCustom = (customVal === 'All' || isCustom === customVal);
        const matchesVisible = (visibleVal === 'All' || isVisible === visibleVal);

        row.style.display = (matchesSearch && matchesCustom && matchesVisible) ? '' : 'none';
      });
    }

    const imageInput = document.getElementById('productImage');
    const imgPreview = document.getElementById('imgPreview');
    const fileInfoBadge = document.getElementById('fileInfoBadge');
    const fileNameText = document.getElementById('fileNameText');

    imageInput.addEventListener('change', function() {
      const file = this.files[0];
      if (file) {
        if (!['image/png', 'image/jpeg', 'image/jpg'].includes(file.type)) {
          alert('Please select a PNG or JPG/JPEG image file.');
          resetImagePreview();
          return;
        }

        const reader = new FileReader();
        reader.onload = function(e) {
          imgPreview.src = e.target.result;
          imgPreview.style.display = 'block';
        };
        reader.readAsDataURL(file);

        fileNameText.textContent = file.name;
        fileInfoBadge.style.display = 'flex';
        isImageRemoved = false;
      }
    });

    function resetImagePreview() {
      imageInput.value = '';
      imgPreview.src = '';
      imgPreview.style.display = 'none';
      fileNameText.textContent = '';
      fileInfoBadge.style.display = 'none';
      isImageRemoved = true; 
    }

    document.addEventListener('DOMContentLoaded', () => {
      if (!currentAdmin) return;

      document.getElementById('logoutBtn').addEventListener('click', () => {
        clearSession();
      });

      const menuToggle = document.getElementById('menuToggle');
      const navContainer = document.getElementById('navContainer');
      menuToggle.addEventListener('click', () => {
        navContainer.classList.toggle('open');
      });

      renderProducts();

      const productModal = document.getElementById('productModal');
      const openAddModalBtn = document.getElementById('openAddModalBtn');
      const closeModalBtn = document.getElementById('closeModalBtn');
      const cancelModalBtn = document.getElementById('cancelModalBtn');
      const modalTitle = document.getElementById('modalTitle');
      const productForm = document.getElementById('productForm');

      openAddModalBtn.addEventListener('click', () => {
        activeEditingId = null;
        isImageRemoved = false;
        modalTitle.textContent = "Add New Product";
        productForm.reset();
        resetImagePreview();
        isImageRemoved = false;
        productModal.classList.add('open');
      });

      const closeModal = () => productModal.classList.remove('open');
      closeModalBtn.addEventListener('click', closeModal);
      cancelModalBtn.addEventListener('click', closeModal);

      productForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const name = document.getElementById('productName').value.trim();
        const price = parseFloat(document.getElementById('productPrice').value);
        const stock = parseInt(document.getElementById('productStock').value);
        const description = document.getElementById('productDescription').value.trim();
        const bestseller = document.getElementById('productBestseller').value;
        const custom = document.getElementById('productCustom').value;
        const visible = document.getElementById('productVisible').value;

        const items = getProducts();

        const readFileAsDataURL = (file) => {
          return new Promise((resolve) => {
            const reader = new FileReader();
            reader.onload = (evt) => resolve(evt.target.result);
            reader.readAsDataURL(file);
          });
        };

        let imageBase64 = null;
        if (imageInput.files && imageInput.files[0]) {
          imageBase64 = await readFileAsDataURL(imageInput.files[0]);
        }

        if (activeEditingId !== null) {
          const idx = items.findIndex(i => i.id === activeEditingId);
          if (idx !== -1) {
            const existingImage = items[idx].image;
            
            let finalImage = existingImage;
            if (imageBase64) {
              finalImage = imageBase64;
            } else if (isImageRemoved) {
              finalImage = ""; // Explicitly deleted flag: empty string prevents future fallbacks
            }

            items[idx] = { 
              ...items[idx], 
              name, 
              price, 
              stock, 
              description, 
              bestseller,
              custom, 
              visible, 
              image: finalImage 
            };
          }
        } else {
          const nextId = items.length ? Math.max(...items.map(i => i.id)) + 1 : 1;
          items.unshift({ 
            id: nextId, 
            name, 
            price, 
            stock, 
            description, 
            bestseller,
            custom, 
            visible, 
            image: isImageRemoved ? "" : imageBase64 
          });
        }

        saveProducts(items);
        renderProducts();
        closeModal();
      });

      const searchInput = document.getElementById('searchInput');
      const customFilter = document.getElementById('customFilter');
      const visibleFilter = document.getElementById('visibleFilter');
      searchInput.addEventListener('input', filterTable);
      customFilter.addEventListener('change', filterTable);
      visibleFilter.addEventListener('change', filterTable);

      const deleteModal = document.getElementById('deleteModal');
      const closeDeleteModalBtn = document.getElementById('closeDeleteModalBtn');
      const cancelDeleteBtn = document.getElementById('cancelDeleteBtn');
      const confirmDeleteBtn = document.getElementById('confirmDeleteBtn');

      const closeDeleteModal = () => deleteModal.classList.remove('open');
      closeDeleteModalBtn.addEventListener('click', closeDeleteModal);
      cancelDeleteBtn.addEventListener('click', closeDeleteModal);

      confirmDeleteBtn.addEventListener('click', () => {
        if (window.idToDelete !== null && window.idToDelete !== undefined) {
          const items = getProducts().filter(i => i.id !== window.idToDelete);
          saveProducts(items);
          renderProducts();
          window.idToDelete = null;
        }
        closeDeleteModal();
      });
    });

    function openEditModal(btn) {
      const row = btn.closest('tr');
      const id = parseInt(row.dataset.id);
      const item = getProducts().find(i => i.id === id);
      if (!item) return;

      activeEditingId = id;
      isImageRemoved = false;

      document.getElementById('modalTitle').textContent = "Edit Product";
      document.getElementById('productName').value = item.name;
      document.getElementById('productPrice').value = item.price;
      document.getElementById('productStock').value = (item.stock === null || item.stock === undefined) ? '' : item.stock;
      document.getElementById('productDescription').value = item.description || '';
      document.getElementById('productBestseller').value = item.bestseller || (item.name.toLowerCase().includes('bear') ? 'Yes' : 'No');
      document.getElementById('productCustom').value = item.custom;
      document.getElementById('productVisible').value = item.visible;
      
      imageInput.value = '';
      
      let imagePath = item.image;

      // Unedited / Initial State Fallback logic
      if (imagePath === undefined || imagePath === null) {
        const lowerName = item.name.toLowerCase();
        if (lowerName.includes('bear')) imagePath = '../images/bear.png';
        else if (lowerName.includes('beaded')) imagePath = '../images/beaded.png';
        else if (lowerName.includes('crochet')) imagePath = '../images/crochet.png';
      }

      if (imagePath && !imagePath.startsWith('data:') && !imagePath.startsWith('../images/')) {
        imagePath = `../images/${imagePath}`;
      }

      // Render image preview ONLY if image exists and is NOT explicitly deleted ("")
      if (imagePath && imagePath !== '') {
        imgPreview.src = imagePath;
        imgPreview.style.display = 'block';

        const fileName = imagePath.startsWith('data:') 
          ? 'Uploaded Image (PNG/JPG)' 
          : imagePath.split('/').pop();

        fileNameText.textContent = fileName;
        fileInfoBadge.style.display = 'flex';
      } else {
        imgPreview.src = '';
        imgPreview.style.display = 'none';
        fileNameText.textContent = '';
        fileInfoBadge.style.display = 'none';
        isImageRemoved = true; 
      }

      document.getElementById('productModal').classList.add('open');
    }

    function promptDelete(btn) {
      const deleteModal = document.getElementById('deleteModal');
      const row = btn.closest('tr');
      const id = parseInt(row.dataset.id);
      const item = getProducts().find(i => i.id === id);

      document.getElementById('deleteItemName').textContent = item ? `'${item.name}'` : '';
      window.idToDelete = id;
      deleteModal.classList.add('open');
    }
  </script>
</body>
</html>
